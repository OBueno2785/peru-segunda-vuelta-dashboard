name: Deploy dashboard a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Cada 30 min: scrapea ONPE, regenera los JSON estáticos y redespliega.
    - cron: "*/30 * * * *"

# Permisos: escribir el historial al repo + desplegar Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Evita despliegues solapados; deja terminar el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar deps backend
        run: pip install -r backend/requirements.txt

      - name: Scrapear ONPE y generar JSON estáticos
        working-directory: backend
        run: python build_static.py

      - name: Persistir historial (commit si cambió)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/historial.json frontend/public/data || true
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "chore(data): snapshot ONPE [skip ci]"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar deps frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
