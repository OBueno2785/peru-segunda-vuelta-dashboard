name: Actualizar proyección (actas JEE)

on:
  workflow_dispatch:
  # NOTA: sin cron. ONPE bloquea las IP de datacenter de GitHub (las peticiones
  # devuelven el HTML del SPA en vez de JSON), así que este job no puede scrapear
  # desde un runner alojado en la nube. Sirve solo como disparo manual y solo
  # funcionará desde un runner self-hosted con IP residencial. La automatización
  # real corre en la máquina local (ver backend/actualizar_proyeccion.ps1).

# Necesita commitear el JSON de proyección al repo.
permissions:
  contents: write

# No solapar corridas de la proyección entre sí.
concurrency:
  group: proyeccion
  cancel-in-progress: false

jobs:
  proyeccion:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar deps ligeras (sin OCR/torch)
        # La proyección solo necesita httpx (scraper) + fastapi (import de main.build_cache).
        run: pip install httpx fastapi

      - name: Descargar actas E/P (solo JSON, sin PDFs)
        working-directory: backend
        # Pacing suave: ONPE bloquea ráfagas desde una sola IP. Si quedan listados
        # bloqueados, el scraper sale con código !=0 y el job NO commitea datos parciales.
        env:
          ACTAS_WORKERS: "3"
          ACTAS_DELAY: "0.5"
        run: python scraper_actas.py --no-pdf

      - name: Refrescar contabilizado al mismo momento
        working-directory: backend
        run: python -c "import asyncio, refresher; print('refresh ok =', asyncio.run(refresher.fetch_fresh()))"

      - name: Regenerar proyección
        working-directory: backend
        run: python proyeccion.py

      - name: Commitear proyección si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/proyeccion.json
          if git diff --cached --quiet; then
            echo "Proyección sin cambios."
          else
            git commit -m "chore(proyeccion): actualizar proyeccion ONPE"
            # Reintegrar lo que el workflow de datos haya commiteado mientras tanto.
            git pull --rebase origin main
            git push
          fi
